name: Update NBA data
on:
  schedule:
    - cron: "0 8 * * *"    # 6pm Brisbane: last night's games are final
  workflow_dispatch:
permissions:
  contents: write
concurrency: nba-data
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run tests
        run: |
          python -m unittest discover -s tests -v
          node tests/logic.test.js
      - name: Fetch, check and write data
        run: python scripts/fetch_data.py
        env:
          NBA_PROXY: ${{ secrets.NBA_PROXY }}
      - name: Commit new data
        run: |
          git config user.name "nba-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          git diff --staged --quiet || git commit -m "Update data $(date -u '+%Y-%m-%d %H:%M')"
          git push
